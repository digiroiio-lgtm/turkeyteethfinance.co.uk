name: SEO validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-baseline:
    name: Current production SEO evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the current production responses without treating an existing defect as a fix
        run: python3 scripts/check-seo.py --report-only --output baseline-seo.json
